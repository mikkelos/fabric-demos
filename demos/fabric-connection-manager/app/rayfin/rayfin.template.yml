id: fabric-connection-manager
name: Fabric Connection Manager
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - ${CONNECTION_MANAGER_APP_ORIGIN}
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
connectors:
  - name: connectioninventory
    type: fabric-sqlanalytics
    config:
      workspaceId: ${CONNECTION_MANAGER_WORKSPACE_ID}
      itemId: ${CONNECTION_MANAGER_SQL_ENDPOINT_ID}
    auth:
      type: application
    operations:
      - name: read
